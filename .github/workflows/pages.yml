name: Publish storefronts (GitHub Pages)

# Every store is a static shop under storefronts/<store-id>/.
# Once Pages is enabled for the repo (Settings → Pages → Source: GitHub Actions),
# all 15 stores are live at https://hampusi97.github.io/dropper-wealth-engine/storefronts/<store-id>/

on:
  push:
    branches: [main]
    paths: ["storefronts/**", "dashboard/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble the site
        run: |
          set -e
          mkdir -p _site
          # storefronts at the site root: /store-01-bizi-bees/ … /store-15-verde-hydro/
          cp -R storefronts/. _site/
          mkdir -p _site/dashboard && cp -R dashboard/. _site/dashboard/
          for d in config reports state public lib; do
            if [ -d "$d" ]; then mkdir -p "_site/$d" && cp -R "$d"/. "_site/$d/"; fi
          done
          cat > _site/index.html <<'HTML'
          <!doctype html><meta charset="utf-8"><title>Dropper OS</title>
          <meta http-equiv="refresh" content="0; url=./storefronts.html">
          <a href="./storefronts.html">All 15 stores</a> · <a href="./dashboard/index.html">Command deck</a>
          HTML
          cp storefronts/index.html _site/storefronts.html 2>/dev/null || true
          ls _site | head -30
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
